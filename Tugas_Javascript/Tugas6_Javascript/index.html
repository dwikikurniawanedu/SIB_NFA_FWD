<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 6 JavaScript</title>
</head>
<body>
  <h1>Tambah Data</h1>

  <form id="form-user">
    <input type="text" id="nama" placeholder="Nama" required>
    <input type="number" id="umur" placeholder="Umur" required>
    <input type="text" id="alamat" placeholder="Alamat" required>
    <input type="email" id="email" placeholder="Email" required>
    
    <button type="submit">Tambah Data</button>
    <button id="btnTambah">Tambah 2 Data</button>
  </form>

  <h2>Daftar Data</h2>

  <button id="btnTampil">Tampilkan Data</button>

  <ul id="list-data"></ul>

  <script type="module" src="app.js"></script>
</body>
</html>
