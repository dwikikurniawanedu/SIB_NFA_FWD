<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - Javascript</title>
</head>
<body>
    <script>
        // Luas Persegi Panjang
        let p = 10;
        let l = 5;
        let luasPersegiPanjang = p * l;
        let x = "Panjang = " + p + "<br>";
        let y = "Lebar = " + l + "<br>";
        document.write("<i><b>Luas Persegi Panjang</b></i>" + "<br>" + x + y + "Luas Persegi Panjang = " + luasPersegiPanjang);

        document.write("<hr>");

        // Luas Persegi
        let s = 7;
        let luasPersegi = s * s;
        let a = "Sisi = " + s + "<br>";
        document.write("<i><b>Luas Persegi</b></i>" + "<br>" + a + "Luas Persegi = " + luasPersegi);
    
        document.write("<hr>");

        // Luas Segitiga
        let alas = 8;
        let tinggi = 6;
        let luasSegitiga = 0.5 * alas * tinggi;
        let b = "Alas = " + alas + "<br>";
        let c = "Tinggi = " + tinggi + "<br>";
        document.write("<i><b>Luas Segitiga</b></i>" + "<br>" + b + c + "Luas Segitiga = " + luasSegitiga);

    </script>
</body>
</html>
